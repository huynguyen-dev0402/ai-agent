name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY_EC2 }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_EC2 }} >> ~/.ssh/known_hosts

      - name: Debug SSH connection (check login)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME_EC2 }}@${{ secrets.HOST_EC2 }} "echo ✅ SSH connected"

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.USERNAME_EC2 }}@${{ secrets.HOST_EC2 }} << 'EOF'
            cd /home/ec2-user/ai-agent-be
            git pull origin main
            pnpm install
            pnpm build
            pm2 delete ai-agent-backend || true
            pm2 start dist/main.js --name ai-agent-backend
          EOF
